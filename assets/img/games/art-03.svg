<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="Cinematic artwork: a rising storm swell lit from beneath by cold cyan light">
  <defs>
    <linearGradient id="g3-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020912"/>
      <stop offset="40%" stop-color="#04161F"/>
      <stop offset="100%" stop-color="#031622"/>
    </linearGradient>
    <linearGradient id="g3-crest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DEBFF" stop-opacity=".9"/>
      <stop offset="18%" stop-color="#00C7E8" stop-opacity=".5"/>
      <stop offset="60%" stop-color="#0B3A4E" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#03131C"/>
    </linearGradient>
    <linearGradient id="g3-crest2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00C7E8" stop-opacity=".55"/>
      <stop offset="30%" stop-color="#0E4A62" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#020C14"/>
    </linearGradient>
    <radialGradient id="g3-underlight" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#00C7E8" stop-opacity=".30"/>
      <stop offset="55%" stop-color="#00C7E8" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#00C7E8" stop-opacity="0"/>
    </radialGradient>
    <filter id="g3-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#g3-bg)"/>
  <rect width="800" height="480" fill="url(#g3-underlight)"/>

  <!-- faint stars above the storm -->
  <g fill="#E8F7FA" opacity=".4">
    <circle cx="96" cy="46" r="1.4"/><circle cx="286" cy="70" r="1.1"/>
    <circle cx="512" cy="38" r="1.5"/><circle cx="690" cy="86" r="1.2"/>
  </g>

  <!-- spray haze -->
  <ellipse cx="380" cy="214" rx="290" ry="54" fill="#0C4257" opacity=".22" filter="url(#g3-soft)"/>

  <!-- far swell -->
  <path d="M-20 300 C 90 250, 180 288, 300 262 C 420 236, 520 282, 640 258 C 720 242, 780 262, 820 250 L820 480 L-20 480 Z"
        fill="url(#g3-crest2)" opacity=".75"/>

  <!-- main breaking wave -->
  <path d="M-20 380 C 60 372, 120 330, 200 300 C 280 270, 340 268, 396 300 C 452 332, 520 342, 600 322 C 680 302, 760 320, 820 306 L820 480 L-20 480 Z"
        fill="url(#g3-crest)"/>

  <!-- crest highlight -->
  <path d="M-20 380 C 60 372, 120 330, 200 300 C 280 270, 340 268, 396 300 C 452 332, 520 342, 600 322 C 680 302, 760 320, 820 306"
        fill="none" stroke="#7DEBFF" stroke-opacity=".7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- foreground trough -->
  <path d="M-20 430 C 90 410, 190 452, 320 434 C 450 416, 560 458, 700 436 C 760 426, 800 440, 820 432 L820 480 L-20 480 Z"
        fill="#02090F"/>
  <path d="M-20 430 C 90 410, 190 452, 320 434 C 450 416, 560 458, 700 436 C 760 426, 800 440, 820 432"
        fill="none" stroke="#00C7E8" stroke-opacity=".28" stroke-width="1.8"/>

  <!-- spray -->
  <g fill="#7DEBFF">
    <circle cx="360" cy="262" r="2.4" opacity=".6"/><circle cx="396" cy="240" r="1.8" opacity=".45"/>
    <circle cx="330" cy="240" r="1.5" opacity=".4"/><circle cx="424" cy="264" r="2" opacity=".35"/>
    <circle cx="286" cy="272" r="1.6" opacity=".3"/><circle cx="462" cy="286" r="1.4" opacity=".25"/>
  </g>
</svg>
