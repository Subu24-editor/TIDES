<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Placeholder avatar for Dreamleak, developer">
  <defs>
    <radialGradient id="dl-bg" cx="40%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#10394C"/>
      <stop offset="56%" stop-color="#0A1D2A"/>
      <stop offset="100%" stop-color="#05121C"/>
    </radialGradient>
    <linearGradient id="dl-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C7E8" stop-opacity=".2"/>
      <stop offset="50%" stop-color="#7DEBFF"/>
      <stop offset="100%" stop-color="#00C7E8" stop-opacity=".2"/>
    </linearGradient>
    <filter id="dl-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <circle cx="120" cy="120" r="120" fill="url(#dl-bg)"/>
  <circle cx="120" cy="104" r="66" fill="#00C7E8" opacity=".13" filter="url(#dl-glow)"/>

  <!-- droplet / leak sigil -->
  <path d="M120 46 C 120 46, 168 104, 168 134 A 48 48 0 1 1 72 134 C 72 104, 120 46, 120 46 Z"
        fill="none" stroke="#7DEBFF" stroke-width="3" stroke-opacity=".85"/>
  <path d="M120 74 C 120 74, 152 112, 152 134 A 32 32 0 1 1 88 134 C 88 112, 120 74, 120 74 Z"
        fill="#0D2938" fill-opacity=".8" stroke="#00C7E8" stroke-width="1.4" stroke-opacity=".5"/>

  <!-- tide inside the droplet -->
  <g fill="none" stroke="url(#dl-wave)" stroke-linecap="round">
    <path d="M92 138 C 102 132, 110 144, 120 138 S 138 130, 148 138" stroke-width="3.4"/>
    <path d="M94 152 C 104 146, 112 158, 122 152 S 140 145, 148 152" stroke-width="2.6" opacity=".6"/>
  </g>

  <!-- circuit ticks, a light futuristic touch -->
  <g stroke="#00C7E8" stroke-opacity=".35" stroke-width="1.5" stroke-linecap="round">
    <path d="M40 120 H 60"/><path d="M180 120 H 200"/>
    <path d="M52 92 H 66"/><path d="M174 148 H 188"/>
  </g>
  <g fill="#A88A52" opacity=".75">
    <circle cx="38" cy="120" r="2"/><circle cx="202" cy="120" r="2"/>
  </g>
</svg>
