<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="The Dark Tides emblem: an ancient moon rising over dark waves">
  <title>The Dark Tides</title>
  <defs>
    <radialGradient id="dt-moon" cx="40%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#F2FEFF"/>
      <stop offset="30%" stop-color="#7DEBFF"/>
      <stop offset="62%" stop-color="#2A93B4"/>
      <stop offset="88%" stop-color="#0E3F55"/>
      <stop offset="100%" stop-color="#08222F"/>
    </radialGradient>

    <radialGradient id="dt-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7DEBFF" stop-opacity=".38"/>
      <stop offset="38%" stop-color="#00C7E8" stop-opacity=".16"/>
      <stop offset="70%" stop-color="#00C7E8" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#00C7E8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="dt-wave-1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A1D2A" stop-opacity="0"/>
      <stop offset="18%" stop-color="#00C7E8" stop-opacity=".55"/>
      <stop offset="50%" stop-color="#7DEBFF" stop-opacity=".95"/>
      <stop offset="82%" stop-color="#00C7E8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#0A1D2A" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="dt-wave-2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A1D2A" stop-opacity="0"/>
      <stop offset="22%" stop-color="#0E7C96" stop-opacity=".7"/>
      <stop offset="55%" stop-color="#00C7E8" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#0A1D2A" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="dt-wave-3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A1D2A" stop-opacity="0"/>
      <stop offset="30%" stop-color="#123847" stop-opacity=".9"/>
      <stop offset="62%" stop-color="#1E6C84" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#0A1D2A" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="dt-ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A88A52" stop-opacity=".55"/>
      <stop offset="50%" stop-color="#A88A52" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#A88A52" stop-opacity=".42"/>
    </linearGradient>

    <clipPath id="dt-moon-clip">
      <circle cx="256" cy="228" r="126"/>
    </clipPath>

    <filter id="dt-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- atmospheric halo behind the moon -->
  <circle cx="256" cy="228" r="240" fill="url(#dt-halo)"/>

  <!-- distant stars -->
  <g fill="#E8F7FA">
    <circle cx="96" cy="96" r="2.1" opacity=".55"/>
    <circle cx="418" cy="120" r="1.6" opacity=".45"/>
    <circle cx="140" cy="180" r="1.3" opacity=".35"/>
    <circle cx="392" cy="212" r="1.9" opacity=".4"/>
    <circle cx="70" cy="252" r="1.5" opacity=".3"/>
    <circle cx="452" cy="298" r="1.4" opacity=".3"/>
  </g>
  <g fill="#A88A52" opacity=".7">
    <circle cx="356" cy="72" r="1.8"/>
    <circle cx="152" cy="316" r="1.5"/>
  </g>

  <!-- decorative outer ring, muted gold, used very sparingly -->
  <circle cx="256" cy="256" r="243" fill="none" stroke="url(#dt-ring)" stroke-width="1.6"/>
  <circle cx="256" cy="256" r="231" fill="none" stroke="#123847" stroke-width="1" opacity=".8"/>

  <!-- the ancient moon -->
  <circle cx="256" cy="228" r="126" fill="url(#dt-moon)"/>
  <g clip-path="url(#dt-moon-clip)">
    <g fill="#0A2C3C" opacity=".26">
      <ellipse cx="212" cy="186" rx="34" ry="30"/>
      <ellipse cx="292" cy="152" rx="18" ry="16"/>
      <ellipse cx="308" cy="242" rx="27" ry="24"/>
      <ellipse cx="196" cy="286" rx="21" ry="18"/>
      <ellipse cx="258" cy="214" rx="11" ry="10"/>
    </g>
    <g fill="#F2FEFF" opacity=".12">
      <ellipse cx="206" cy="176" rx="26" ry="22"/>
      <ellipse cx="302" cy="234" rx="19" ry="16"/>
    </g>
    <!-- terminator shading, keeps the moon from looking flat -->
    <circle cx="316" cy="272" r="150" fill="#04121B" opacity=".34" filter="url(#dt-soft)"/>
  </g>
  <circle cx="256" cy="228" r="126" fill="none" stroke="#7DEBFF" stroke-width="1.2" opacity=".55"/>

  <!-- tides: waves rising across the lower moon -->
  <g fill="none" stroke-linecap="round">
    <path d="M28 350 C 96 314, 152 386, 224 352 S 350 300, 404 344 S 458 380, 484 352"
          stroke="url(#dt-wave-3)" stroke-width="9" opacity=".85"/>
    <path d="M22 392 C 104 356, 158 424, 236 390 S 356 340, 412 386 S 466 418, 490 392"
          stroke="url(#dt-wave-2)" stroke-width="11"/>
    <path d="M34 436 C 112 402, 170 466, 248 432 S 362 386, 418 428 S 462 456, 478 438"
          stroke="url(#dt-wave-1)" stroke-width="13"/>
  </g>

  <!-- moonlight reflection on the water -->
  <g opacity=".5" fill="#7DEBFF">
    <rect x="236" y="368" width="40" height="3" rx="1.5" opacity=".5"/>
    <rect x="222" y="410" width="68" height="3" rx="1.5" opacity=".35"/>
    <rect x="246" y="452" width="22" height="2.5" rx="1.25" opacity=".25"/>
  </g>
</svg>
